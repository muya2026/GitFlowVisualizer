<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitFlow Visualizer - Interactive Git Command Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            750: '#2d3748',
                            850: '#1a202c',
                            950: '#0f1419'
                        },
                        violet: {
                            450: '#8b5cf6',
                            550: '#7c3aed'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        .toggle-checkbox:checked {
            right: 0;
            border-color: #8b5cf6;
        }
        
        .toggle-checkbox:checked + .toggle-label {
            background-color: #8b5cf6;
        }
        
        .command-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .command-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.15);
        }
        
        .terminal-window {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
        }
        
        .syntax-keyword { color: #c678dd; }
        .syntax-flag { color: #56b6c2; }
        .syntax-string { color: #98c379; }
        .syntax-comment { color: #5c6370; }
        .syntax-command { color: #61afef; }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-950 text-gray-100 min-h-screen">
    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-code-branch text-violet-450 text-2xl"></i>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-violet-450 to-cyan-400 bg-clip-text text-transparent">
                        GitFlow Visualizer
                    </h1>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <input 
                            type="text" 
                            id="searchInput"
                            placeholder="Search commands..." 
                            class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 pl-10 text-sm focus:outline-none focus:border-violet-450 focus:ring-1 focus:ring-violet-450 w-64"
                        >
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>
                    <button onclick="resetAll()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg px-4 py-2 text-sm transition-colors">
                        <i class="fas fa-redo mr-2"></i>Reset
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Panel - Controls -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Category Tabs -->
                <div class="flex space-x-2 overflow-x-auto pb-2">
                    <button onclick="filterCategory('all')" class="category-btn active bg-violet-550 text-white px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">
                        All Commands
                    </button>
                    <button onclick="filterCategory('undo')" class="category-btn bg-slate-800 hover:bg-slate-700 text-gray-300 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">
                        <i class="fas fa-undo mr-2"></i>Undo & Reset
                    </button>
                    <button onclick="filterCategory('branch')" class="category-btn bg-slate-800 hover:bg-slate-700 text-gray-300 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">
                        <i class="fas fa-code-branch mr-2"></i>Branching
                    </button>
                    <button onclick="filterCategory('merge')" class="category-btn bg-slate-800 hover:bg-slate-700 text-gray-300 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">
                        <i class="fas fa-code-merge mr-2"></i>Merging
                    </button>
                    <button onclick="filterCategory('stash')" class="category-btn bg-slate-800 hover:bg-slate-700 text-gray-300 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">
                        <i class="fas fa-box mr-2"></i>Stashing
                    </button>
                    <button onclick="filterCategory('commit')" class="category-btn bg-slate-800 hover:bg-slate-700 text-gray-300 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">
                        <i class="fas fa-check-circle mr-2"></i>Commit
                    </button>
                    <button onclick="filterCategory('remote')" class="category-btn bg-slate-800 hover:bg-slate-700 text-gray-300 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">
                        <i class="fas fa-cloud mr-2"></i>Remote
                    </button>
                </div>

                <!-- Command Cards Grid -->
                <div id="commandsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Cards will be populated by JavaScript -->
                </div>
            </div>

            <!-- Right Panel - Live Preview -->
            <div class="lg:col-span-1">
                <div class="sticky top-24 space-y-6">
                    <!-- Terminal Window -->
                    <div class="terminal-window rounded-xl overflow-hidden shadow-2xl">
                        <div class="bg-slate-800 px-4 py-3 border-b border-slate-700 flex items-center justify-between">
                            <div class="flex space-x-2">
                                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                            </div>
                            <span class="text-xs text-gray-400 font-mono">terminal</span>
                        </div>
                        <div class="p-6">
                            <div class="font-mono text-sm leading-relaxed">
                                <span class="syntax-comment">$ </span>
                                <span id="liveCommand" class="text-white">git <span class="syntax-command">status</span></span>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="space-y-3">
                        <button onclick="copyToClipboard()" class="w-full bg-gradient-to-r from-violet-550 to-violet-450 hover:from-violet-450 hover:to-violet-550 text-white font-medium py-3 px-6 rounded-lg transition-all duration-200 flex items-center justify-center space-x-2 shadow-lg shadow-violet-550/25">
                            <i class="fas fa-copy"></i>
                            <span id="copyText">Copy to Clipboard</span>
                        </button>
                        
                        <div class="bg-slate-800/50 rounded-lg p-4 border border-slate-700">
                            <h4 class="text-sm font-semibold text-gray-300 mb-3">Quick Tips</h4>
                            <ul class="text-xs text-gray-400 space-y-2">
                                <li class="flex items-start">
                                    <i class="fas fa-lightbulb text-yellow-500 mr-2 mt-0.5"></i>
                                    <span>Use search to find commands by intent</span>
                                </li>
                                <li class="flex items-start">
                                    <i class="fas fa-lightbulb text-yellow-500 mr-2 mt-0.5"></i>
                                    <span>Toggle options to build complex commands</span>
                                </li>
                                <li class="flex items-start">
                                    <i class="fas fa-lightbulb text-yellow-500 mr-2 mt-0.5"></i>
                                    <span>Click copy to get clean terminal output</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-900/50 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="flex flex-col md:flex-row items-center justify-between space-y-4 md:space-y-0">
                <div class="flex items-center space-x-2 text-gray-400 text-sm">
                    <span>Designed & Built with</span>
                    <i class="fas fa-heart text-red-500"></i>
                    <span>by</span>
                    <a href="https://github.com/muya2026" target="_blank" class="text-violet-450 hover:text-violet-400 transition-colors">muya2026</a>
                    <span>|</span>
                    <a href="https://github.com/soms3r" target="_blank" class="text-violet-450 hover:text-violet-400 transition-colors">soms3r</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="https://github.com/muya2026/gitflow-visualizer" target="_blank" class="text-gray-400 hover:text-white transition-colors">
                        <i class="fab fa-github text-lg"></i>
                    </a>
                    <span class="text-gray-500 text-sm">v1.0.0</span>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Command data structure
        const commandsData = [
            {
                id: 'undo-commit',
                category: 'undo',
                title: 'Undo Last Commit',
                description: 'Safely undo the last commit',
                icon: 'fa-undo',
                baseCommand: 'git reset',
                options: [
                    { id: 'soft', label: '--soft', description: 'Keep changes staged' },
                    { id: 'mixed', label: '--mixed', description: 'Keep changes unstaged (default)' },
                    { id: 'hard', label: '--hard', description: 'Discard all changes', warning: true }
                ],
                inputs: [],
                searchTerms: ['undo', 'revert', 'back', 'mistake']
            },
            {
                id: 'amend-commit',
                category: 'commit',
                title: 'Amend Commit',
                description: 'Modify the last commit',
                icon: 'fa-edit',
                baseCommand: 'git commit --amend',
                options: [
                    { id: 'no-edit', label: '--no-edit', description: 'Keep same message' }
                ],
                inputs: [
                    { id: 'message', label: 'Commit Message', placeholder: 'Enter new message', type: 'text' }
                ],
                searchTerms: ['amend', 'modify', 'change', 'edit']
            },
            {
                id: 'create-branch',
                category: 'branch',
                title: 'Create Branch',
                description: 'Create and switch to new branch',
                icon: 'fa-code-branch',
                baseCommand: 'git checkout -b',
                options: [],
                inputs: [
                    { id: 'branch-name', label: 'Branch Name', placeholder: 'feature/new-feature', type: 'text' }
                ],
                searchTerms: ['branch', 'new', 'create', 'checkout']
            },
            {
                id: 'delete-branch',
                category: 'branch',
                title: 'Delete Branch',
                description: 'Remove a local branch',
                icon: 'fa-trash',
                baseCommand: 'git branch -d',
                options: [
                    { id: 'force', label: '-D', description: 'Force delete', warning: true }
                ],
                inputs: [
                    { id: 'branch-name', label: 'Branch Name', placeholder: 'branch-name', type: 'text' }
                ],
                searchTerms: ['delete', 'remove', 'branch', 'cleanup']
            },
            {
                id: 'merge-branch',
                category: 'merge',
                title: 'Merge Branch',
                description: 'Merge a branch into current',
                icon: 'fa-code-merge',
                baseCommand: 'git merge',
                options: [
                    { id: 'no-ff', label: '--no-ff', description: 'No fast-forward' },
                    { id: 'squash', label: '--squash', description: 'Squash commits' }
                ],
                inputs: [
                    { id: 'branch-name', label: 'Branch to Merge', placeholder: 'feature-branch', type: 'text' }
                ],
                searchTerms: ['merge', 'combine', 'integrate']
            },
            {
                id: 'stash-push',
                category: 'stash',
                title: 'Stash Changes',
                description: 'Temporarily save changes',
                icon: 'fa-box',
                baseCommand: 'git stash push',
                options: [
                    { id: 'include-untracked', label: '-u', description: 'Include untracked files' },
                    { id: 'all', label: '-a', description: 'Include all files' }
                ],
                inputs: [
                    { id: 'message', label: 'Stash Message', placeholder: 'WIP: working on feature', type: 'text' }
                ],
                searchTerms: ['stash', 'save', 'temporary', 'wip']
            },
            {
                id: 'stash-pop',
                category: 'stash',
                title: 'Pop Stash',
                description: 'Restore stashed changes',
                icon: 'fa-box-open',
                baseCommand: 'git stash pop',
                options: [],
                inputs: [],
                searchTerms: ['stash', 'restore', 'pop', 'apply']
            },
            {
                id: 'push-origin',
                category: 'remote',
                title: 'Push to Remote',
                description: 'Push changes to remote',
                icon: 'fa-cloud-upload-alt',
                baseCommand: 'git push',
                options: [
                    { id: 'set-upstream', label: '-u origin', description: 'Set upstream' },
                    { id: 'force', label: '--force', description: 'Force push', warning: true }
                ],
                inputs: [
                    { id: 'remote', label: 'Remote', placeholder: 'origin', type: 'text' },
                    { id: 'branch', label: 'Branch', placeholder: 'main', type: 'text' }
                ],
                searchTerms: ['push', 'upload', 'remote', 'origin']
            },
            {
                id: 'pull-origin',
                category: 'remote',
                title: 'Pull from Remote',
                description: 'Fetch and merge changes',
                icon: 'fa-cloud-download-alt',
                baseCommand: 'git pull',
                options: [
                    { id: 'rebase', label: '--rebase', description: 'Rebase instead of merge' }
                ],
                inputs: [
                    { id: 'remote', label: 'Remote', placeholder: 'origin', type: 'text' },
                    { id: 'branch', label: 'Branch', placeholder: 'main', type: 'text' }
                ],
                searchTerms: ['pull', 'download', 'fetch', 'update']
            },
            {
                id: 'clone-repo',
                category: 'remote',
                title: 'Clone Repository',
                description: 'Clone a remote repository',
                icon: 'fa-copy',
                baseCommand: 'git clone',
                options: [
                    { id: 'depth', label: '--depth 1', description: 'Shallow clone' }
                ],
                inputs: [
                    { id: 'url', label: 'Repository URL', placeholder: 'https://github.com/user/repo.git', type: 'text' }
                ],
                searchTerms: ['clone', 'download', 'repository', 'repo']
            },
            {
                id: 'log-history',
                category: 'commit',
                title: 'View History',
                description: 'Show commit history',
                icon: 'fa-history',
                baseCommand: 'git log',
                options: [
                    { id: 'oneline', label: '--oneline', description: 'One line per commit' },
                    { id: 'graph', label: '--graph', description: 'Show graph' },
                    { id: 'all', label: '--all', description: 'All branches' }
                ],
                inputs: [
                    { id: 'n', label: 'Number of Commits', placeholder: '10', type: 'number' }
                ],
                searchTerms: ['log', 'history', 'commits', 'view']
            },
            {
                id: 'cherry-pick',
                category: 'commit',
                title: 'Cherry Pick',
                description: 'Apply a specific commit',
                icon: 'fa-cherry',
                baseCommand: 'git cherry-pick',
                options: [
                    { id: 'no-commit', label: '--no-commit', description: 'Don\'t auto-commit' }
                ],
                inputs: [
                    { id: 'commit-hash', label: 'Commit Hash', placeholder: 'abc1234', type: 'text' }
                ],
                searchTerms: ['cherry-pick', 'apply', 'commit', 'specific']
            }
        ];

        let activeCategory = 'all';
        let selectedOptions = {};
        let inputValues = {};

        function initializeState() {
            commandsData.forEach(cmd => {
                selectedOptions[cmd.id] = {};
                cmd.options.forEach(opt => {
                    selectedOptions[cmd.id][opt.id] = false;
                });
                cmd.inputs.forEach(inp => {
                    inputValues[`${cmd.id}-${inp.id}`] = '';
                });
            });
        }

        function renderCommands(filter = 'all', searchTerm = '') {
            const grid = document.getElementById('commandsGrid');
            let filtered = commandsData;

            if (filter !== 'all') {
                filtered = filtered.filter(cmd => cmd.category === filter);
            }

            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(cmd => {
                    return cmd.title.toLowerCase().includes(term) ||
                           cmd.description.toLowerCase().includes(term) ||
                           cmd.searchTerms.some(t => t.includes(term));
                });
            }

            grid.innerHTML = filtered.map(cmd => `
                <div class="command-card bg-slate-800/50 border border-slate-700 rounded-xl p-5 hover:border-violet-450/50 fade-in" data-category="${cmd.category}">
                    <div class="flex items-start space-x-3 mb-4">
                        <div class="w-10 h-10 rounded-lg bg-violet-550/20 flex items-center justify-center flex-shrink-0">
                            <i class="fas ${cmd.icon} text-violet-450"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold text-gray-100">${cmd.title}</h3>
                            <p class="text-sm text-gray-400">${cmd.description}</p>
                        </div>
                    </div>
                    
                    ${cmd.options.length > 0 ? `
                        <div class="space-y-2 mb-4">
                            ${cmd.options.map(opt => `
                                <label class="flex items-center justify-between cursor-pointer group">
                                    <span class="text-sm text-gray-300 group-hover:text-white transition-colors">${opt.label}</span>
                                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                        <input type="checkbox" 
                                               name="${cmd.id}-${opt.id}" 
                                               id="${cmd.id}-${opt.id}"
                                               class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-200 ${selectedOptions[cmd.id][opt.id] ? 'right-0 border-violet-450' : 'right-5 border-gray-300'}"
                                               onchange="toggleOption('${cmd.id}', '${opt.id}')"
                                               ${selectedOptions[cmd.id][opt.id] ? 'checked' : ''}
                                        />
                                        <label for="${cmd.id}-${opt.id}" class="toggle-label block overflow-hidden h-5 rounded-full bg-slate-600 cursor-pointer transition-colors duration-200 ${selectedOptions[cmd.id][opt.id] ? 'bg-violet-450' : ''}"></label>
                                    </div>
                                </label>
                            `).join('')}
                        </div>
                    ` : ''}
                    
                    ${cmd.inputs.length > 0 ? `
                        <div class="space-y-3">
                            ${cmd.inputs.map(inp => `
                                <div>
                                    <label class="block text-xs text-gray-400 mb-1">${inp.label}</label>
                                    <input type="${inp.type}" 
                                           value="${inputValues[`${cmd.id}-${inp.id}`] || ''}"
                                           oninput="updateInput('${cmd.id}-${inp.id}', this.value)"
                                           placeholder="${inp.placeholder}"
                                           class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-violet-450 focus:ring-1 focus:ring-violet-450 transition-colors"
                                    />
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function toggleOption(commandId, optionId) {
            selectedOptions[commandId][optionId] = !selectedOptions[commandId][optionId];
            updateLiveCommand();
            renderCommands(activeCategory, document.getElementById('searchInput').value);
        }

        function updateInput(inputId, value) {
            inputValues[inputId] = value;
            updateLiveCommand();
        }

        function updateLiveCommand() {
            const liveCommand = document.getElementById('liveCommand');
            let commandParts = [];
            
            // Find active command (most recently interacted or first one)
            const activeCmd = commandsData.find(cmd => {
                const hasOptions = cmd.options.some(opt => selectedOptions[cmd.id][opt.id]);
                const hasInputs = cmd.inputs.some(inp => inputValues[`${cmd.id}-${inp.id}`]);
                return hasOptions || hasInputs;
            }) || commandsData[0];

            if (!activeCmd) return;

            let cmdStr = activeCmd.baseCommand;
            
            // Add selected options
            activeCmd.options.forEach(opt => {
                if (selectedOptions[activeCmd.id][opt.id]) {
                    cmdStr += ` ${opt.label}`;
                }
            });
            
            // Add input values
            activeCmd.inputs.forEach(inp => {
                const value = inputValues[`${activeCmd.id}-${inp.id}`];
                if (value && value.trim()) {
                    cmdStr += ` ${value.trim()}`;
                }
            });

            // Syntax highlighting
            const parts = cmdStr.split(' ');
            const highlighted = parts.map((part, index) => {
                if (index === 0) return `<span class="syntax-command">${part}</span>`;
                if (part.startsWith('--') || part.startsWith('-')) return `<span class="syntax-flag">${part}</span>`;
                if (part.includes('/') || part.includes('.') || part.includes(':')) return `<span class="syntax-string">${part}</span>`;
                return `<span class="syntax-keyword">${part}</span>`;
            }).join(' ');

            liveCommand.innerHTML = highlighted;
        }

        function copyToClipboard() {
            const commandText = document.getElementById('liveCommand').innerText.replace('$ ', '');
            navigator.clipboard.writeText(commandText).then(() => {
                const copyText = document.getElementById('copyText');
                const originalText = copyText.innerText;
                copyText.innerText = 'Copied!';
                
                setTimeout(() => {
                    copyText.innerText = originalText;
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }

        function filterCategory(category) {
            activeCategory = category;
            
            // Update button states
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-violet-550', 'text-white');
                btn.classList.add('bg-slate-800', 'text-gray-300');
            });
            
            event.target.classList.remove('bg-slate-800', 'text-gray-300');
            event.target.classList.add('bg-violet-550', 'text-white');
            
            renderCommands(category, document.getElementById('searchInput').value);
        }

        function resetAll() {
            initializeState();
            document.getElementById('searchInput').value = '';
            filterCategory('all');
            updateLiveCommand();
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderCommands(activeCategory, e.target.value);
        });

        // Initialize
        initializeState();
        renderCommands();
        updateLiveCommand();
    </script>
</body>
</html>
